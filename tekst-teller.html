<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tekst teller</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;
      --surface:#111118;
      --accent:#00ff88;
      --accent2:#0088ff;
      --text:#e8e8f0;
      --muted:#555566;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Space Mono',monospace;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,255,136,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,136,0.04) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    .container{
      position:relative;
      text-align:center;
      padding:2rem;
      width:min(920px,100%);
    }
    .label{
      font-size:.7rem;
      letter-spacing:.3em;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:1.5rem;
    }
    .title{
      font-family:'Syne',sans-serif;
      font-size:clamp(2.3rem,7vw,4.6rem);
      font-weight:800;
      line-height:.92;
      margin-bottom:2.4rem;
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .card{
      background:var(--surface);
      border:1px solid rgba(0,255,136,0.15);
      border-radius:4px;
      padding:1.6rem 1.6rem 1.2rem;
      position:relative;
      box-shadow:0 0 60px rgba(0,255,136,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
      max-width:860px;
      margin:0 auto 1.2rem;
    }
    .card::before{
      content:'';
      position:absolute;
      top:-1px;
      left:20px;
      right:20px;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
    }

    .textarea{
      width:min(820px,92vw);
      min-height:220px;
      resize:vertical;
      background:transparent;
      border:1px solid rgba(0,255,136,0.25);
      color:var(--text);
      font-family:'Space Mono',monospace;
      padding:1rem;
      border-radius:2px;
      outline:none;
      line-height:1.6;
      margin-bottom:1rem;
    }
    .textarea::placeholder{color:var(--muted)}
    .textarea:focus{
      border-color:rgba(0,255,136,0.55);
      box-shadow:0 0 0 3px rgba(0,255,136,0.08);
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1px;
      background:rgba(0,255,136,0.08);
      border:1px solid rgba(0,255,136,0.08);
      border-radius:3px;
      overflow:hidden;
      max-width:860px;
      margin:0 auto 1.2rem;
    }
    .meta-item{
      background:var(--surface);
      padding:1.1rem 1.2rem;
      text-align:left;
    }
    .meta-key{
      font-size:.6rem;
      letter-spacing:.3em;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:.35rem;
    }
    .meta-val{
      font-size:1.05rem;
      color:var(--text);
      font-weight:700;
      letter-spacing:.02em;
    }

    .btn{
      background:transparent;
      border:1px solid rgba(0,255,136,0.3);
      color:var(--accent);
      font-family:'Space Mono',monospace;
      font-size:.7rem;
      letter-spacing:.2em;
      text-transform:uppercase;
      padding:.75rem 1rem;
      cursor:pointer;
      border-radius:2px;
      transition:all .2s;
      margin-top:.5rem;
    }
    .btn:hover{
      background:rgba(0,255,136,0.08);
      border-color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,136,0.15);
    }

    @media (max-width:640px){
      .meta-grid{grid-template-columns:1fr}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Content tool</div>
    <div class="title">Tekst<br>Teller</div>

    <div class="card">
      <textarea id="text" class="textarea" placeholder="Plak of typ hier je tekst…"></textarea>

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-key">Karakters</div>
          <div class="meta-val" id="charCount">0</div>
        </div>
        <div class="meta-item">
          <div class="meta-key">Woorden</div>
          <div class="meta-val" id="wordCount">0</div>
        </div>
      </div>

      <button class="btn" id="clearBtn">Wis tekst</button>
    </div>
  </div>

  <script>
    const elText = document.getElementById('text');
    const elChars = document.getElementById('charCount');
    const elWords = document.getElementById('wordCount');

    function countWords(s){
      const t = s.trim();
      if (!t) return 0;
      return t.split(/\s+/).filter(Boolean).length;
    }

    function updateCounts(){
      const v = elText.value || '';
      elChars.textContent = v.length;
      elWords.textContent = countWords(v);
    }

    elText.addEventListener('input', updateCounts);

    document.getElementById('clearBtn').addEventListener('click', () => {
      elText.value = '';
      updateCounts();
      elText.focus();
    });

    updateCounts();
  </script>
</body>
</html>
