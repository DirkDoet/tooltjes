<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Rekenmachine</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0a0a0f;
      --surface:#111118;
      --accent:#00ff88;
      --accent2:#0088ff;
      --text:#e8e8f0;
      --muted:#555566;
      --danger:#ff4455;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:'Space Mono',monospace;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    body::before{
      content:'';
      position:fixed;
      inset:0;
      background-image:
        linear-gradient(rgba(0,255,136,0.04) 1px,transparent 1px),
        linear-gradient(90deg,rgba(0,255,136,0.04) 1px,transparent 1px);
      background-size:40px 40px;
      pointer-events:none;
    }

    .container{
      position:relative;
      text-align:center;
      padding:2rem;
      width:min(920px,100%);
    }
    .label{
      font-size:.7rem;
      letter-spacing:.3em;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:1.5rem;
    }
    .title{
      font-family:'Syne',sans-serif;
      font-size:clamp(2.3rem,7vw,4.6rem);
      font-weight:800;
      line-height:.92;
      margin-bottom:2.4rem;
      background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
      background-clip:text;
    }

    .card{
      background:var(--surface);
      border:1px solid rgba(0,255,136,0.15);
      border-radius:4px;
      padding:1.6rem 1.6rem 1.2rem;
      position:relative;
      box-shadow:0 0 60px rgba(0,255,136,0.05), inset 0 1px 0 rgba(255,255,255,0.05);
      max-width:860px;
      margin:0 auto 1.2rem;
    }
    .card::before{
      content:'';
      position:absolute;
      top:-1px;
      left:20px;
      right:20px;
      height:2px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
    }

    .input{
      width:min(820px,92vw);
      background:transparent;
      border:1px solid rgba(0,255,136,0.25);
      color:var(--text);
      font-family:'Space Mono',monospace;
      padding:1rem;
      border-radius:2px;
      outline:none;
      font-size:1.1rem;
      line-height:1.4;
      margin-bottom:1rem;
      text-align:right;
    }
    .input::placeholder{color:var(--muted)}
    .input:focus{
      border-color:rgba(0,255,136,0.55);
      box-shadow:0 0 0 3px rgba(0,255,136,0.08);
    }

    .meta-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1px;
      background:rgba(0,255,136,0.08);
      border:1px solid rgba(0,255,136,0.08);
      border-radius:3px;
      overflow:hidden;
      max-width:860px;
      margin:0 auto 1rem;
    }
    .meta-item{
      background:var(--surface);
      padding:1.1rem 1.2rem;
      text-align:left;
    }
    .meta-key{
      font-size:.6rem;
      letter-spacing:.3em;
      color:var(--muted);
      text-transform:uppercase;
      margin-bottom:.35rem;
    }
    .meta-val{
      font-size:1.05rem;
      color:var(--text);
      font-weight:700;
      letter-spacing:.02em;
      word-break:break-word;
    }
    .meta-val.error{color:var(--danger)}

    .pad{
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:10px;
      max-width:860px;
      margin:0 auto;
    }

    .btn{
      background:transparent;
      border:1px solid rgba(0,255,136,0.3);
      color:var(--accent);
      font-family:'Space Mono',monospace;
      font-size:.8rem;
      letter-spacing:.15em;
      text-transform:uppercase;
      padding:.9rem .9rem;
      cursor:pointer;
      border-radius:2px;
      transition:all .2s;
      user-select:none;
    }
    .btn:hover{
      background:rgba(0,255,136,0.08);
      border-color:var(--accent);
      box-shadow:0 0 20px rgba(0,255,136,0.15);
    }
    .btn.ghost{
      color:var(--text);
      border-color:rgba(232,232,240,0.12);
    }
    .btn.ghost:hover{
      background:rgba(232,232,240,0.06);
      border-color:rgba(232,232,240,0.25);
      box-shadow:0 0 20px rgba(232,232,240,0.06);
    }
    .btn.wide{grid-column:span 2}

    @media (max-width:640px){
      .meta-grid{grid-template-columns:1fr}
      .pad{gap:8px}
      .btn{padding:.85rem .7rem}
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="label">Content tool</div>
    <div class="title">Reken<br>Machine</div>

    <div class="card">
      <input id="expr" class="input" inputmode="decimal" autocomplete="off" spellcheck="false" placeholder="Typ een som, bijvoorbeeld: (12.5 * 3) - 4/2" />

      <div class="meta-grid">
        <div class="meta-item">
          <div class="meta-key">Resultaat</div>
          <div class="meta-val" id="result">0</div>
        </div>
        <div class="meta-item">
          <div class="meta-key">Status</div>
          <div class="meta-val" id="status">Ok</div>
        </div>
      </div>

      <div class="pad" aria-label="Rekenmachine">
        <button class="btn ghost" data-k="(" type="button">(</button>
        <button class="btn ghost" data-k=")" type="button">)</button>
        <button class="btn ghost" id="backBtn" type="button">Terug</button>
        <button class="btn" id="clearBtn" type="button">Wis</button>

        <button class="btn" data-k="7" type="button">7</button>
        <button class="btn" data-k="8" type="button">8</button>
        <button class="btn" data-k="9" type="button">9</button>
        <button class="btn" data-k="/" type="button">/</button>

        <button class="btn" data-k="4" type="button">4</button>
        <button class="btn" data-k="5" type="button">5</button>
        <button class="btn" data-k="6" type="button">6</button>
        <button class="btn" data-k="*" type="button">*</button>

        <button class="btn" data-k="1" type="button">1</button>
        <button class="btn" data-k="2" type="button">2</button>
        <button class="btn" data-k="3" type="button">3</button>
        <button class="btn" data-k="-" type="button">-</button>

        <button class="btn" data-k="0" type="button">0</button>
        <button class="btn" data-k="." type="button">.</button>
        <button class="btn wide" id="eqBtn" type="button">=</button>
        <button class="btn" data-k="+" type="button">+</button>
      </div>
    </div>
  </div>

  <script>
    const elExpr = document.getElementById('expr');
    const elResult = document.getElementById('result');
    const elStatus = document.getElementById('status');

    function setOk(resultText){
      elResult.classList.remove('error');
      elStatus.classList.remove('error');
      elResult.textContent = resultText;
      elStatus.textContent = 'Ok';
    }

    function setError(msg){
      elResult.classList.add('error');
      elStatus.classList.add('error');
      elResult.textContent = '—';
      elStatus.textContent = msg;
    }

    function isAllowedExpression(s){
      // alleen cijfers, spaties, punt, haakjes en basis operators
      return /^[0-9\s+\-*/().]*$/.test(s);
    }

    function safeEval(expr){
      const cleaned = (expr || '').trim();
      if (!cleaned) return { ok:true, value:'0' };
      if (!isAllowedExpression(cleaned)) return { ok:false, error:'Ongeldige tekens' };

      // voorkom dubbele operators zoals ** of //
      if (/(\*\*|\/\/)/.test(cleaned)) return { ok:false, error:'Ongeldige operator' };

      try{
        // evaluatie in afgesloten scope
        const fn = new Function('"use strict"; return (' + cleaned + ')');
        const out = fn();
        if (typeof out !== 'number' || !Number.isFinite(out)) return { ok:false, error:'Geen geldig resultaat' };
        return { ok:true, value: String(out) };
      }catch(e){
        return { ok:false, error:'Fout in som' };
      }
    }

    function calculate(){
      const res = safeEval(elExpr.value);
      if (res.ok) setOk(res.value);
      else setError(res.error);
    }

    function insertAtCursor(text){
      const input = elExpr;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      const before = input.value.slice(0,start);
      const after = input.value.slice(end);
      input.value = before + text + after;
      const pos = start + text.length;
      input.setSelectionRange(pos,pos);
      input.focus();
      calculate();
    }

    // live berekenen
    elExpr.addEventListener('input', calculate);

    // keypad
    document.querySelectorAll('[data-k]').forEach(btn => {
      btn.addEventListener('click', () => insertAtCursor(btn.getAttribute('data-k')));
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      elExpr.value = '';
      elExpr.focus();
      calculate();
    });

    document.getElementById('backBtn').addEventListener('click', () => {
      const input = elExpr;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;

      if (start !== end){
        // verwijder selectie
        const before = input.value.slice(0,start);
        const after = input.value.slice(end);
        input.value = before + after;
        input.setSelectionRange(start,start);
      }else if (start > 0){
        // verwijder 1 teken links
        const before = input.value.slice(0,start-1);
        const after = input.value.slice(start);
        input.value = before + after;
        input.setSelectionRange(start-1,start-1);
      }
      input.focus();
      calculate();
    });

    document.getElementById('eqBtn').addEventListener('click', () => {
      calculate();
      elExpr.focus();
    });

    // toetsenbord
    elExpr.addEventListener('keydown', (e) => {
      if (e.key === 'Enter'){
        e.preventDefault();
        calculate();
      }
      if (e.key === 'Escape'){
        e.preventDefault();
        elExpr.value = '';
        calculate();
      }
    });

    calculate();
  </script>
</body>
</html>
