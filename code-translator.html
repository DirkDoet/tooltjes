<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Code Translator</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #111118;
      --surface2: #16161f;
      --accent: #00ff88;
      --accent2: #0088ff;
      --text: #e8e8f0;
      --muted: #555566;
      --danger: #ff4455;
      --warn: #ffcc00;
      --border: rgba(0,255,136,0.12);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
      padding: 3rem 1rem 4rem;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 1280px;
      margin: 0 auto;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .header-label {
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .title {
      font-family: 'Syne', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      line-height: 0.9;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Main layout */
    .editor-layout {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 0;
      align-items: stretch;
      min-height: 600px;
    }

    /* Panel */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    .panel-left::before,
    .panel-right::before {
      content: '';
      position: absolute;
      top: -1px; left: 20px; right: 20px;
      height: 2px;
      pointer-events: none;
    }

    .panel-left::before {
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    .panel-right::before {
      background: linear-gradient(90deg, transparent, var(--accent2), transparent);
    }

    /* Panel header */
    .panel-header {
      padding: 1rem 1.25rem 0.75rem;
      border-bottom: 1px solid rgba(0,255,136,0.07);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .panel-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .panel-left .panel-dot  { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
    .panel-right .panel-dot { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

    /* Custom dropdown */
    .lang-selector {
      position: relative;
      flex: 1;
    }

    .lang-input {
      width: 100%;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(0,255,136,0.15);
      border-radius: 2px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.45rem 2rem 0.45rem 0.75rem;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s;
      letter-spacing: 0.05em;
    }

    .lang-input:focus { border-color: rgba(0,255,136,0.4); }

    .panel-right .lang-input { border-color: rgba(0,136,255,0.2); }
    .panel-right .lang-input:focus { border-color: rgba(0,136,255,0.5); }

    .lang-arrow {
      position: absolute;
      right: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 0.6rem;
      pointer-events: none;
      transition: transform 0.2s;
    }

    .lang-selector.open .lang-arrow { transform: translateY(-50%) rotate(180deg); }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      background: #0d0d15;
      border: 1px solid rgba(0,255,136,0.2);
      border-radius: 3px;
      z-index: 100;
      max-height: 240px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    }

    .lang-selector.open .lang-dropdown { display: block; }

    .lang-option {
      padding: 0.55rem 0.85rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: var(--muted);
      transition: all 0.1s;
      letter-spacing: 0.05em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .lang-option:hover,
    .lang-option.focused {
      background: rgba(0,255,136,0.06);
      color: var(--text);
    }

    .lang-option.selected {
      color: var(--accent);
      background: rgba(0,255,136,0.05);
    }

    .lang-option .lang-icon { font-size: 0.9rem; width: 1.2rem; text-align: center; }

    .lang-dropdown::-webkit-scrollbar { width: 4px; }
    .lang-dropdown::-webkit-scrollbar-track { background: transparent; }
    .lang-dropdown::-webkit-scrollbar-thumb { background: rgba(0,255,136,0.2); border-radius: 2px; }

    .panel-actions {
      display: flex;
      gap: 0.5rem;
      margin-left: auto;
      flex-shrink: 0;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
      white-space: nowrap;
    }

    .icon-btn:hover {
      border-color: rgba(0,255,136,0.3);
      color: var(--text);
    }

    .icon-btn.primary {
      border-color: rgba(0,255,136,0.3);
      color: var(--accent);
    }

    .icon-btn.primary:hover {
      background: rgba(0,255,136,0.08);
      border-color: var(--accent);
    }

    .icon-btn.copied {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0,255,136,0.08);
    }

    /* Code areas */
    .code-area {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 0.82rem;
      line-height: 1.75;
      padding: 1.25rem;
      outline: none;
      resize: none;
      width: 100%;
      min-height: 500px;
      tab-size: 2;
    }

    .code-area::placeholder { color: var(--muted); }

    .code-area.output-area {
      color: rgba(232,232,240,0.82);
      cursor: default;
    }

    .code-area.loading-state {
      opacity: 0.4;
    }

    /* Status bar */
    .panel-footer {
      padding: 0.5rem 1.25rem;
      border-top: 1px solid rgba(0,255,136,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .footer-info {
      font-size: 0.55rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* Middle column — translate button */
    .middle-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 1rem;
      gap: 1rem;
    }

    .translate-btn {
      background: rgba(0,255,136,0.08);
      border: 1px solid rgba(0,255,136,0.35);
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 1rem 0.75rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.2s;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
    }

    .translate-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, transparent 0%, rgba(0,255,136,0.06) 100%);
      opacity: 0;
      transition: opacity 0.2s;
    }

    .translate-btn:hover {
      background: rgba(0,255,136,0.14);
      border-color: var(--accent);
      box-shadow: 0 0 24px rgba(0,255,136,0.12);
    }

    .translate-btn:hover::before { opacity: 1; }

    .translate-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .translate-btn.loading {
      animation: pulse-btn 1.2s ease-in-out infinite;
    }

    @keyframes pulse-btn {
      0%, 100% { border-color: rgba(0,255,136,0.35); box-shadow: none; }
      50% { border-color: var(--accent); box-shadow: 0 0 20px rgba(0,255,136,0.2); }
    }

    .swap-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .swap-btn:hover {
      border-color: rgba(0,255,136,0.3);
      color: var(--accent);
      transform: rotate(180deg);
    }

    /* Error banner */
    .error-banner {
      background: rgba(255,68,85,0.08);
      border: 1px solid rgba(255,68,85,0.25);
      border-radius: 3px;
      color: var(--danger);
      font-size: 0.72rem;
      padding: 0.75rem 1.1rem;
      margin-top: 1rem;
      display: none;
      letter-spacing: 0.05em;
      line-height: 1.6;
    }

    /* Loading overlay on right panel */
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10,10,15,0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      z-index: 10;
      display: none;
      backdrop-filter: blur(2px);
    }

    .loading-overlay.active { display: flex; }

    .loading-text {
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .loading-dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      margin: 0 3px;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); opacity: 0.3; }
      50% { transform: translateY(-6px); opacity: 1; }
    }

    .fade-in { animation: fadeIn 0.5s ease forwards; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 800px) {
      .editor-layout {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
      }
      .middle-col {
        flex-direction: row;
        padding: 0.5rem 0;
        justify-content: center;
      }
      .translate-btn {
        writing-mode: horizontal-tb;
        padding: 0.75rem 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="page fade-in">

    <!-- Header -->
    <div class="header">
      <div class="header-label">ai-powered · top 25 talen</div>
      <div class="title">CODE<br>TRANSLATOR</div>
    </div>

    <!-- Editor -->
    <div class="editor-layout">

      <!-- LEFT PANEL — input -->
      <div class="panel panel-left" id="leftPanel">
        <div class="panel-header">
          <div class="panel-dot"></div>
          <div class="lang-selector" id="leftSelector">
            <input class="lang-input" id="leftInput" type="text" placeholder="Selecteer taal..." autocomplete="off" spellcheck="false" />
            <span class="lang-arrow">▾</span>
            <div class="lang-dropdown" id="leftDropdown"></div>
          </div>
          <div class="panel-actions">
            <button class="icon-btn" onclick="clearInput()">wissen</button>
          </div>
        </div>
        <textarea
          class="code-area"
          id="codeInput"
          placeholder="// Plak hier je code..."
          spellcheck="false"
          oninput="updateInputStats()"
        ></textarea>
        <div class="panel-footer">
          <span class="footer-info" id="inputStats">0 regels · 0 tekens</span>
        </div>
      </div>

      <!-- MIDDLE -->
      <div class="middle-col">
        <button class="swap-btn" onclick="swapLanguages()" title="Wissel talen">⇄</button>
        <button class="translate-btn" id="translateBtn" onclick="runTranslate()">
          ↓ VERTAAL
        </button>
      </div>

      <!-- RIGHT PANEL — output -->
      <div class="panel panel-right" id="rightPanel">
        <div class="panel-header">
          <div class="panel-dot"></div>
          <div class="lang-selector" id="rightSelector">
            <input class="lang-input" id="rightInput" type="text" placeholder="Doeltaal..." autocomplete="off" spellcheck="false" />
            <span class="lang-arrow">▾</span>
            <div class="lang-dropdown" id="rightDropdown"></div>
          </div>
          <div class="panel-actions">
            <button class="icon-btn primary" id="copyBtn" onclick="copyOutput()">kopieer</button>
          </div>
        </div>
        <textarea
          class="code-area output-area"
          id="codeOutput"
          placeholder="// Vertaling verschijnt hier..."
          spellcheck="false"
          readonly
        ></textarea>
        <div class="panel-footer">
          <span class="footer-info" id="outputStats">0 regels · 0 tekens</span>
        </div>

        <!-- Loading overlay -->
        <div class="loading-overlay" id="loadingOverlay">
          <div class="loading-dots">
            <span></span><span></span><span></span>
          </div>
          <div class="loading-text" id="loadingText">Vertalen...</div>
        </div>
      </div>

    </div>

    <!-- Error -->
    <div class="error-banner" id="errorBanner"></div>

  </div>

  <script>
    // ── Language list ─────────────────────────────────────────────────────────
    const LANGUAGES = [
      { name: 'Python',      icon: '🐍' },
      { name: 'JavaScript',  icon: '🟨' },
      { name: 'TypeScript',  icon: '🔷' },
      { name: 'Java',        icon: '☕' },
      { name: 'C',           icon: '⚙️' },
      { name: 'C++',         icon: '⚙️' },
      { name: 'C#',          icon: '🟦' },
      { name: 'Go',          icon: '🐹' },
      { name: 'Rust',        icon: '🦀' },
      { name: 'Swift',       icon: '🧡' },
      { name: 'Kotlin',      icon: '🟪' },
      { name: 'PHP',         icon: '🐘' },
      { name: 'Ruby',        icon: '💎' },
      { name: 'R',           icon: '📊' },
      { name: 'Scala',       icon: '🔴' },
      { name: 'Dart',        icon: '🎯' },
      { name: 'Lua',         icon: '🌙' },
      { name: 'Perl',        icon: '🐪' },
      { name: 'Haskell',     icon: '🔮' },
      { name: 'Elixir',      icon: '💜' },
      { name: 'Clojure',     icon: '🟢' },
      { name: 'Shell/Bash',  icon: '🖥️' },
      { name: 'SQL',         icon: '🗄️' },
      { name: 'HTML/CSS',    icon: '🌐' },
      { name: 'MATLAB',      icon: '📐' },
    ];

    const WORKER_URL = 'https://tooltjes-api.antonenmonique.workers.dev/ai';

    // ── Dropdown state ────────────────────────────────────────────────────────
    let leftLang  = 'Python';
    let rightLang = 'JavaScript';
    let focusedIndex = { left: -1, right: -1 };

    function initSelector(side) {
      const inputEl    = document.getElementById(side + 'Input');
      const dropdownEl = document.getElementById(side + 'Dropdown');
      const selectorEl = document.getElementById(side + 'Selector');
      const defaultVal = side === 'left' ? leftLang : rightLang;

      inputEl.value = defaultVal;
      renderDropdown(side, '');

      inputEl.addEventListener('focus', () => {
        inputEl.select();
        selectorEl.classList.add('open');
        renderDropdown(side, '');
      });

      inputEl.addEventListener('input', () => {
        selectorEl.classList.add('open');
        renderDropdown(side, inputEl.value);
      });

      inputEl.addEventListener('keydown', e => {
        const items  = dropdownEl.querySelectorAll('.lang-option');
        const fIdx   = focusedIndex[side];

        if (e.key === 'ArrowDown') {
          e.preventDefault();
          const next = Math.min(fIdx + 1, items.length - 1);
          focusedIndex[side] = next;
          updateFocus(side);
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          const prev = Math.max(fIdx - 1, 0);
          focusedIndex[side] = prev;
          updateFocus(side);
        } else if (e.key === 'Enter') {
          e.preventDefault();
          if (fIdx >= 0 && items[fIdx]) {
            items[fIdx].click();
          } else {
            // pick first match
            if (items[0]) items[0].click();
          }
        } else if (e.key === 'Escape') {
          closeDropdown(side);
          inputEl.value = side === 'left' ? leftLang : rightLang;
        }
      });

      document.addEventListener('click', e => {
        if (!selectorEl.contains(e.target)) closeDropdown(side);
      });
    }

    function renderDropdown(side, query) {
      const dropdownEl = document.getElementById(side + 'Dropdown');
      const current    = side === 'left' ? leftLang : rightLang;
      const q = query.trim().toLowerCase();

      const filtered = LANGUAGES.filter(l =>
        q === '' || l.name.toLowerCase().includes(q)
      );

      focusedIndex[side] = -1;

      dropdownEl.innerHTML = filtered.map((l, i) => `
        <div class="lang-option${l.name === current ? ' selected' : ''}"
          data-name="${l.name}" data-index="${i}">
          <span class="lang-icon">${l.icon}</span>
          ${l.name}
        </div>
      `).join('');

      dropdownEl.querySelectorAll('.lang-option').forEach(opt => {
        opt.addEventListener('click', () => {
          selectLang(side, opt.dataset.name);
        });
      });
    }

    function updateFocus(side) {
      const dropdownEl = document.getElementById(side + 'Dropdown');
      const items      = dropdownEl.querySelectorAll('.lang-option');
      items.forEach((el, i) => el.classList.toggle('focused', i === focusedIndex[side]));
      const focused = items[focusedIndex[side]];
      if (focused) focused.scrollIntoView({ block: 'nearest' });
    }

    function selectLang(side, name) {
      if (side === 'left')  leftLang  = name;
      else                  rightLang = name;
      document.getElementById(side + 'Input').value = name;
      closeDropdown(side);
    }

    function closeDropdown(side) {
      document.getElementById(side + 'Selector').classList.remove('open');
      focusedIndex[side] = -1;
    }

    // ── Swap languages ────────────────────────────────────────────────────────
    function swapLanguages() {
      const tmpLang = leftLang;
      leftLang  = rightLang;
      rightLang = tmpLang;
      document.getElementById('leftInput').value  = leftLang;
      document.getElementById('rightInput').value = rightLang;

      // Also swap code if there's output
      const output = document.getElementById('codeOutput').value;
      if (output) {
        const input = document.getElementById('codeInput').value;
        document.getElementById('codeInput').value  = output;
        document.getElementById('codeOutput').value = input;
        updateInputStats();
        updateOutputStats();
      }
    }

    // ── Translation ───────────────────────────────────────────────────────────
    async function runTranslate() {
      const code = document.getElementById('codeInput').value.trim();
      if (!code) return;

      if (!leftLang || !rightLang) {
        showError('Selecteer een bron- en doeltaal.');
        return;
      }

      if (leftLang === rightLang) {
        showError('Bron- en doeltaal zijn hetzelfde. Kies een andere doeltaal.');
        return;
      }

      hideError();
      showLoading(`${leftLang} → ${rightLang}`);

      const prompt = `You are an expert programmer. Translate the following ${leftLang} code to ${rightLang}.

Rules:
- Output ONLY the translated code, no explanations, no markdown, no code fences.
- Preserve the logic, structure, and comments (translate comments to English if needed).
- Use idiomatic ${rightLang} patterns and conventions.
- If something has no direct equivalent, use the closest ${rightLang} alternative and add a brief inline comment.
- Do not include any text before or after the code.

${leftLang} code to translate:
${code}`;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [{ role: 'user', content: prompt }]
          })
        });

        if (!res.ok) {
          const err = await res.text();
          throw new Error(`Worker ${res.status}: ${err.substring(0, 200)}`);
        }

        const data = await res.json();
        if (data.error) throw new Error(JSON.stringify(data.error));

        let result = data.choices?.[0]?.message?.content?.trim() || '';
        if (!result) throw new Error('Leeg antwoord ontvangen.');

        // Strip accidental markdown fences
        result = result
          .replace(/^```[\w]*\n?/i, '')
          .replace(/```\s*$/i, '')
          .trim();

        document.getElementById('codeOutput').value = result;
        updateOutputStats();

      } catch(e) {
        showError(`Vertaling mislukt: ${e.message}`);
      } finally {
        hideLoading();
      }
    }

    // ── Helpers ───────────────────────────────────────────────────────────────
    function clearInput() {
      document.getElementById('codeInput').value  = '';
      document.getElementById('codeOutput').value = '';
      updateInputStats();
      updateOutputStats();
      hideError();
    }

    function copyOutput() {
      const text = document.getElementById('codeOutput').value;
      if (!text) return;

      const btn = document.getElementById('copyBtn');

      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      };

      try {
        navigator.clipboard.writeText(text).catch(fallback);
      } catch { fallback(); }

      btn.textContent = '✓ gekopieerd';
      btn.classList.add('copied');
      setTimeout(() => { btn.textContent = 'kopieer'; btn.classList.remove('copied'); }, 2000);
    }

    function updateInputStats() {
      const val   = document.getElementById('codeInput').value;
      const lines = val ? val.split('\n').length : 0;
      document.getElementById('inputStats').textContent = `${lines} regels · ${val.length} tekens`;
    }

    function updateOutputStats() {
      const val   = document.getElementById('codeOutput').value;
      const lines = val ? val.split('\n').length : 0;
      document.getElementById('outputStats').textContent = `${lines} regels · ${val.length} tekens`;
    }

    function showLoading(label) {
      document.getElementById('loadingOverlay').classList.add('active');
      document.getElementById('loadingText').textContent = `Vertalen: ${label}`;
      document.getElementById('translateBtn').disabled = true;
      document.getElementById('translateBtn').classList.add('loading');
    }

    function hideLoading() {
      document.getElementById('loadingOverlay').classList.remove('active');
      document.getElementById('translateBtn').disabled = false;
      document.getElementById('translateBtn').classList.remove('loading');
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      el.textContent = '⚠ ' + msg;
      el.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBanner').style.display = 'none';
    }

    // Tab key support in textarea
    document.getElementById('codeInput').addEventListener('keydown', e => {
      if (e.key === 'Tab') {
        e.preventDefault();
        const ta    = e.target;
        const start = ta.selectionStart;
        const end   = ta.selectionEnd;
        ta.value = ta.value.substring(0, start) + '  ' + ta.value.substring(end);
        ta.selectionStart = ta.selectionEnd = start + 2;
      }
      // Ctrl/Cmd + Enter to translate
      if ((e.ctrlKey || e.metaKey) && e.key === "Enter") runTranslate();
    });

    // ── Init ──────────────────────────────────────────────────────────────────
    initSelector('left');
    initSelector('right');
  </script>
</body>
</html>
